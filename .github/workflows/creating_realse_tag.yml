on:
  pull_request:
    branches:
      - master
    types:
      - closed

  workflow_dispatch:

name: Create Release tag

jobs:
  build:
    if: github.event.pull_request.merged == false
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '16'
      - name: Set Release Version
        run: echo "RELEASE_VERSION=v6.20.0" >> $GITHUB_ENV"
      - name: install pkg
        run: npm install -g pkg@latest
      - name: package
        run: pkg --targets node16-linux-x64,node16-macos-x64,node16-win-x64 .
      - name: Rename binaries
        run: |
          mv cli-linux qyrus-cli-linux
          mv cli-macos qyrus-cli-macos
          mv cli-win.exe qyrus-cli-win.exe
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }} 
          name: ${{ env.RELEASE_VERSION }} 
          prerelease: false
          files: |
            qyrus-cli-linux
            qyrus-cli-macos
            qyrus-cli-win.exe
